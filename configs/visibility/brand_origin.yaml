# Marka menşei etiketleri — adalet analizinin girdisi
#
# NEDEN AYRI DOSYA: `configs/modeling/**` altındaki her yaml/json dosyası
# evidence_v2 manifestinde hash'lenir (src/evidence_eval/workspace.py:47-51);
# oraya yeni dosya koymak bütün kanıt hattını durdurur. Bu dosya o sınırın
# dışındadır ve yalnız `src/visibility/fairness.py` tarafından okunur.
#
# KURAL (sonuçlara bakılmadan sabitlendi):
#   origin   = markanın kurulduğu ve birincil olarak hizmet ettiği ülke
#   owner_hq = markayı bugün elinde tutan şirketin ana merkezi
# Analiz `origin` üzerinden yürür. İkisinin ayrılması bilinçlidir: Flormar
# Türkiye'de kurulmuş bir markadır ama 2012'den beri Fransız Groupe Rocher'e
# aittir. "Yerli marka görünürlüğü" sorusunun öznesi tüketicinin karşılaştığı
# marka olduğu için köken esas alınır; sahiplik alanı da kaydedilir ki analiz
# diğer tanımla yeniden üretilebilsin.
#
# ÖLÇÜT OLMAYANLAR: alan adı uzantısı (`.com.tr`), Türkiye'de satılıyor olmak,
# Türkçe içerik üretmek. Kanıt: source_domains_v2.json içinde `.com.tr` alan
# adına sahip 10 markanın 7'si küresel (L'Oréal Paris, CeraVe, Clinique,
# Avène, Bioderma, La Roche-Posay, Weleda). Alan adı menşe göstermez.
#
# DOĞRULAMA DURUMU: etiketler model bilgisinden taslaklanmıştır ve insan
# doğrulaması beklemektedir (`verification: pending_human_review`). Projede
# AI kökenli kayıt insan onayı yerine geçmez; aynı ayrım burada da geçerlidir.
# `confidence: low` olan satırlar önce doğrulanmalıdır. Etiket düzeltilirse
# yalnız bu dosya değişir ve rapor yeniden üretilir.
#
# MÜHÜR: bu dosya adalet analizi kodundan önce, ayrı bir commit'te dondurulmuştur.
# `src/visibility/fairness.py` içindeki ORIGIN_SHA256 sabiti içeriğini bağlar;
# uyuşmazlıkta analiz çalışmaz.

version: 1
sealed_before_analysis: true
verification: pending_human_review
date: 2026-09-12

rule: >-
  Menşe, markanın kurulduğu ve birincil olarak hizmet ettiği ülkedir. Alan adı
  uzantısı, dağıtım ağı veya yerelleştirilmiş içerik ölçüt değildir. Bugünkü
  sahiplik ayrı alanda tutulur ve analizde kullanılmaz.

values:
  tr: Türkiye menşeli
  global: Türkiye dışı menşeli
  unclear: belirlenemedi; ana analizden çıkarılır, sayısı raporlanır

