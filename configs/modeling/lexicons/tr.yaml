# Turkish snippet lexicons, version 1.
# Same five hypothesis groups as the English lexicon so the two tracks stay
# comparable. Terms are matched against text normalised with the project's
# i-folding, which is why entries are written without dotted-I distinctions
# mattering ("ıspatlanmıs" and "ispatlanmis" collapse to the same token run).
version: 1
language: tr
