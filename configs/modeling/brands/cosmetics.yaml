# Cosmetics brand registry. Turkish track only.
# Alias merging matters more here than exclusion: the long tail of one-off
# surface forms falls out of the universe via the mention threshold, but frequent
# brands are split across spelling variants that must be merged first.
# Turkish casefolding damage is undone by i-folding in comparison_key():
# "ınnisfree"->Innisfree, "ınkey list"->INKEY List, "kıko"->KIKO, "ısana"->Isana.
